services:
  postgres:
    image: postgres:16-alpine
    container_name: ges_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123nanayaw
      POSTGRES_DB: ges_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ges_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: ges_backend
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      # Neon cloud Postgres — DATABASE_URL makes the individual DB_* vars below unused
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ges_db
      DB_USER: postgres
      DB_PASSWORD: 123nanayaw
      JWT_SECRET: ges_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
      FABRIC_CRYPTO_PATH: /app/fabric-crypto
      FABRIC_CHANNEL: geschannel
      FABRIC_CHAINCODE: ges-verify
      FABRIC_GES_PEER: peer0.ges.ges.edu.gh:7051
      FABRIC_GES_PEER_HOST: peer0.ges.ges.edu.gh
      # Firebase Cloud Storage
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY_ID: ${FIREBASE_PRIVATE_KEY_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_CLIENT_ID: ${FIREBASE_CLIENT_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      # Read from ges/.env (gitignored) via Compose's own .env substitution
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      # Synced copy of the crypto-config that actually started the live Fabric
      # peers (source of truth: /home/raphael/fabric/ges-network/crypto-config
      # in WSL Ubuntu). Re-sync with a plain `cp -r` from WSL if TLS handshakes
      # start failing after the network is regenerated.
      - ../ges_final_year_fabric/crypto-config:/app/fabric-crypto:ro
      - ../ges_final_year_fabric/data:/app/ges_final_year_fabric/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ges_network
      - fabric_network

networks:
  ges_network:
    driver: bridge
  fabric_network:
    external: true
    # Run `docker network ls | grep ges-network` to confirm this matches your setup.
    name: ges-network_ges-network

volumes:
  postgres_data:
