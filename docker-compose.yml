services:
  postgres:
    image: postgres:16-alpine
    container_name: ges_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123nanayaw
      POSTGRES_DB: ges_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ges_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: ges_backend
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ges_db
      DB_USER: postgres
      DB_PASSWORD: 123nanayaw
      JWT_SECRET: ges_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
    volumes:
      - uploads_data:/app/src/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ges_network

networks:
  ges_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data: